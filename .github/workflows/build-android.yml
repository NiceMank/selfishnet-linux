name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to attach assets to (e.g. v1.1.0)"
        required: false
        default: ""
  push:
    branches: ["main", "master"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Android SDK 35 packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Package APK and checksum
        run: |
          mkdir -p dist/android
          DATE="$(date +%Y%m%d)"
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="dist/android/SelfishNet-Companion-${DATE}.apk"
          cp "$APK_SRC" "$APK_OUT"
          (cd dist/android && sha256sum "$(basename "$APK_OUT")" > SHA256SUMS-Android.txt)
          ls -lh dist/android/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfishnet-android-apk
          path: dist/android/*

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" dist/android/* --clobber
