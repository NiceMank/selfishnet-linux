name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m compileall selfishnet_core.py selfishnet_ui_common.py selfishnet.py selfishnet_tui.py selfishnet_windows.py selfishnet_windows_tui.py
          $iconArgs = @()
          if (Test-Path "assets/selfishnet.ico") {
            $iconArgs = @("--icon", "assets/selfishnet.ico")
          }
          pyinstaller --clean --noconfirm `
            --name SelfishNet-GUI `
            --onefile --windowed `
            --uac-admin `
            @iconArgs `
            --collect-submodules scapy `
            --add-data "assets;assets" `
            selfishnet_windows_tui.py
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $date = Get-Date -Format "yyyyMMdd"
          $zipPath = "dist/release/SelfishNet-Windows-$date.zip"
          Compress-Archive -Force -Path dist/SelfishNet-GUI.exe -DestinationPath $zipPath
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $zipPath)" | Out-File -Encoding ascii "dist/release/SHA256SUMS.txt"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: selfishnet-windows-release
          path: dist/release/*
