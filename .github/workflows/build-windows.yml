name: Build Windows release

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m compileall selfishnet.py selfishnet_tui.py
          pyinstaller --clean --noconfirm `
            --name SelfishNet-GUI `
            --onefile --windowed `
            --hidden-import scapy `
            --add-data "assets;assets" `
            selfishnet_tui.py
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $date = Get-Date -Format "yyyyMMdd"
          Compress-Archive -Force `
            -Path dist/SelfishNet-GUI.exe `
            -DestinationPath "dist/release/SelfishNet-Windows-$date.zip"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: selfishnet-windows-release
          path: dist/release/*.zip
