name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to attach assets to (e.g. v1.1.0)"
        required: false
        default: ""
  push:
    branches: ["main", "master"]
    paths:
      - "mynet_filter_core.py"
      - "mynet_filter_ui_common.py"
      - "mynet_filter_windows.py"
      - "mynet_filter_windows_gui.py"
      - "assets/**"
      - "requirements.txt"
      - "build-windows.ps1"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m compileall mynet_filter_core.py mynet_filter_ui_common.py mynet_filter.py mynet_filter_gui.py mynet_filter_windows.py mynet_filter_windows_gui.py
          $iconArgs = @()
          if (Test-Path "assets/mynet-filter.ico") {
            $iconArgs = @("--icon", "assets/mynet-filter.ico")
          }
          pyinstaller --clean --noconfirm `
            --name MyNet-Filter-GUI `
            --onefile --windowed `
            --uac-admin `
            @iconArgs `
            --collect-submodules scapy `
            --add-data "assets;assets" `
            mynet_filter_windows_gui.py
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $date = Get-Date -Format "yyyyMMdd"
          $zipPath = "dist/release/MyNet-Filter-Windows-$date.zip"
          Compress-Archive -Force -Path dist/MyNet-Filter-GUI.exe -DestinationPath $zipPath
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $zipPath)" | Out-File -Encoding ascii "dist/release/SHA256SUMS-Windows.txt"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mynet-filter-windows-release
          path: dist/release/*

      - name: Attach Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $files = Get-ChildItem -Path "dist/release" -File | ForEach-Object { $_.FullName }
          gh release upload $env:TAG_NAME @files --clobber
