[project]
name = "selfishnet-linux"
version = "1.1.0"
description = "Contrôleur de bande passante Wi-Fi / LAN (Linux, Windows et API Companion Android)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E402", "E501"]
