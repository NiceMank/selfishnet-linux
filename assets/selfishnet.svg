<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="50%" stop-color="#ff7b72"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="#30363d" stroke-width="8"/>

  <!-- Wi-Fi Waves -->
  <!-- Outer wave -->
  <path d="M 120 220 A 180 180 0 0 1 392 220" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round"/>
  <!-- Middle wave -->
  <path d="M 165 275 A 120 120 0 0 1 347 275" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
  <!-- Inner wave -->
  <path d="M 210 330 A 60 60 0 0 1 302 330" fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Central Base Dot -->
  <circle cx="256" cy="385" r="22" fill="#58a6ff"/>

  <!-- Priority Lightning / Cut overlay badge -->
  <g filter="url(#glow)">
    <polygon points="275,100 215,250 265,250 235,370 325,210 275,210" fill="url(#bolt)" stroke="#090d13" stroke-width="4"/>
  </g>
</svg>